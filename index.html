<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Emulador NFC</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- O contêiner onde o emulador vai renderizar a tela do jogo e os controles -->
    <div id="game"></div>

    <script>
        // Pega o nome do jogo que você digitar no final do link da URL
        const urlParams = new URLSearchParams(window.location.search);
        const jogoSelecionado = urlParams.get('jogo');

        // Se você não especificar um jogo na URL, ele tenta carregar "jogo.sfc" por padrão
        const romFinal = jogoSelecionado ? jogoSelecionado : "jogo.sfc";

        // Configurações do Emulador
        EmuJS_System = "snes";      // Mude para "gba" ou "nes" se for o caso
        EmuJS_Rom = romFinal;       // Carrega o jogo dinamicamente (.sfc)
        EmuJS_StartOnLoaded = true;
    </script>
    
    <!-- Script correto para carregar o motor do emulador diretamente no navegador -->
    <script src="https://jsdelivr.net"></script>

</body>
</html>
