<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meu Emulador NFC</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #game-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <script>
        // Pega o nome do jogo pela URL
        const urlParams = new URLSearchParams(window.location.search);
        const jogoSelecionado = urlParams.get('jogo');
        const romFinal = jogoSelecionado ? jogoSelecionado : "jogo.sfc";

        // CONFIGURAÇÕES DO EMULATORJS PARA OPERA MOBILE
        EmuJS_CONTAINER = "game-container";
        EmuJS_SYSTEM = "snes";
        EmuJS_ROM = romFinal;
        
        // Caminho dos arquivos base do emulador
        EmuJS_URL = "https://jsdelivr.net"; 

        // Força configurações para evitar que o Opera bloqueie a inicialização do interpretador
        EmuJS_MOBILE = true;            // Ativa controles na tela imediatamente
        EmuJS_AUTOPLAY = true;          // Tenta iniciar sem exigir múltiplos cliques
    </script>
    
    <!-- Carrega o inicializador oficial -->
    <script src="https://jsdelivr.netloader.js"></script>

</body>
</html>
