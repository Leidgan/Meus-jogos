<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Emulador NFC</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        /* O EmulatorJS exige que o container tenha tamanho definido */
        #game-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <!-- O EmulatorJS procura obrigatoriamente por uma div vazia para injetar o emulador -->
    <div id="game-container"></div>

    <script>
        // Pega o nome do jogo pela URL (?jogo=nome.sfc)
        const urlParams = new URLSearchParams(window.location.search);
        const jogoSelecionado = urlParams.get('jogo');
        const romFinal = jogoSelecionado ? jogoSelecionado : "jogo.sfc";

        // CONFIGURAÇÕES OBRIGATÓRIAS DO EMULATORJS
        EmuJS_CONTAINER = "game-container"; // ID exato da div acima
        EmuJS_SYSTEM = "snes";             // Sistema em letras minúsculas
        EmuJS_ROM = romFinal;              // Caminho do arquivo .sfc
        
        // Define de onde o emulador vai baixar os arquivos de sistema (CSS/JS internos)
        EmuJS_URL = "https://jsdelivr.net"; 
    </script>
    
    <!-- Carrega o inicializador oficial -->
    <script src="https://jsdelivr.netloader.js"></script>

</body>
</html>
