    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background-color: #0b0c10; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; overflow: hidden; }
        #main-container { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 15px; align-items: center; justify-content: flex-start; overflow-y: auto; }
        h1 { font-size: 22px; color: #66fcf1; margin-bottom: 15px; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .search-box { width: 100%; max-width: 450px; margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #1f2833; background-color: #1f2833; color: white; font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: #66fcf1; }
        .game-list { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 10px; max-height: 65vh; overflow-y: auto; margin-top: 10px; padding-right: 5px; }
        .game-item { background: #1f2833; padding: 12px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; transition: 0.2s; }
        .game-item:hover { border-color: #66fcf1; background: #2b3644; }
        .badge { background: #c5a059; color: #0b0c10; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        #loading-screen { display: none; flex-direction: column; width: 100%; height: 100%; align-items: center; justify-content: center; background: #000; text-align: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #66fcf1; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #game-container { display: none; width: 100%; height: 100%; position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        #btn-voltar { position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.8); color: #66fcf1; border: 1px solid #66fcf1; padding: 8px 15px; font-size: 12px; border-radius: 5px; cursor: pointer; z-index: 9999; font-weight: bold; }
    </style>
