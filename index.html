<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mega Man X3 - SNES Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #emulator-container {
            width: 100%;
            height: 100%;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="emulator-container">
        <div id="game"></div>
    </div>

    <script>
        // Configurações do EmulatorJS
        EJS_player = '#game';
        EJS_core = 'snes'; 
        EJS_startOnLoaded = true; 
        
        // Link direto para o arquivo na raiz do seu repositório
        EJS_gameUrl = 'Mega Man X3 (USA).sfc'; 

        // Arquivos do sistema carregados via CDN externa estável
        EJS_pathtodata = 'https://emulatorjs.org';

        // Inicialização automática do emulador
        (function() {
            const script = document.createElement('script');
            script.src = 'https://emulatorjs.orgloader.js';
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
