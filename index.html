<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Emulador SNES</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #menu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: white; }
        .game-btn { background: #222; color: #fff; border: 2px solid #555; padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; border-radius: 8px; transition: 0.2s; min-width: 250px; text-align: center; text-decoration: none; }
        .game-btn:hover { background: #444; border-color: #3b82f6; }
        #game-container { width: 100%; height: 100%; display: none; }
    </style>
</head>
<body>

    <!-- MENU DE SELEÇÃO (Aparece se nenhum jogo for escolhido) -->
    <div id="menu">
        <h2>Escolha um Jogo:</h2>
        <!-- Modifique os nomes dos arquivos abaixo de acordo com as suas ROMs na pasta roms/ -->
        <a class="game-btn" href="?legend-of-zelda-the-a-link-to-the-past-usina.sfc">Legend of Zelda the a link to the past</a>
        <a class="game-btn" href="?jogo=mega-man-x3.sfc">Megaa Man X3</a>
        <a class="game-btn" href="?jogo=zelda.sfc">The Legend of Zelda</a>
    </div>

    <!-- CONTAINER DO EMULADOR -->
    <div id="game-container">
        <div id="emulator"></div>
    </div>

    <script>
        // Função para ler o nome do jogo na barra de endereço da URL
        const urlParams = new URLSearchParams(window.location.search);
        const jogoSelecionado = urlParams.get('jogo');

        if (jogoSelecionado) {
            // Esconde o menu e mostra o emulador
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            // Configuração do EmulatorJS
            window.EJS_player = '#emulator';
            window.EJS_core = 'snes'; 
            window.EJS_gameUrl = 'roms/' + jogoSelecionado; // Aponta para a pasta roms/
            window.EJS_pathtodata = 'https://jsdelivr.net';

            // Carrega o script do emulador dinamicamente
            const script = document.createElement('script');
            script.src = 'https://jsdelivr.netloader.js';
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
