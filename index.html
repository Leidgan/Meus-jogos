<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogando SNES Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #emulator-container {
            width: 100%;
            height: 100%;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- O emulador vai carregar diretamente aqui dentro -->
    <div id="emulator-container">
        <div id="game"></div>
    </div>

    <script>
        // Configurações do EmulatorJS para carregamento automático online
        EJS_player = '#game';
        EJS_core = 'snes'; // Define o núcleo como Super Nintendo
        EJS_startOnLoaded = true; // Inicia o jogo assim que terminar de baixar
        
        // ATENÇÃO: Substitua 'jogo.sfc' pelo nome exato do seu arquivo que está no GitHub
        EJS_gameUrl = 'Mega Man X3 (USA).sfc'; 

        // Arquivos de sistema e inicialização puxados via CDN externa
        EJS_pathtodata = 'https://emulatorjs.org';

        // Carrega o script principal do emulador de forma automática ao abrir a página
        (function() {
            const script = document.createElement('script');
            script.src = 'https://emulatorjs.orgloader.js';
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
